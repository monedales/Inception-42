[www]
; User/group that runs the PHP worker processes (non-root web user)
user = www-data
group = www-data

; Listen on TCP 9000 on all interfaces, so NGINX (another container) can reach
; php-fpm over the Docker network. Debian's default is a local Unix socket,
; which only works inside this container.
listen = 0.0.0.0:9000

; Process manager: spawn worker processes dynamically on demand.
; Low values on purpose (small project, keeps memory usage down).
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

; Send php-fpm errors to the container's stderr, so 'docker logs' shows them
php_admin_value[error_log] = /dev/stderr
php_admin_flag[log_errors] = on
