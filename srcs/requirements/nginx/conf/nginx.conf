server {
	# Listen ONLY on 443 with TLS. Port 80 is never declared, so plain http
	# cannot connect at all (subject rule: only 443 is reachable).
	listen 443 ssl;
	listen [::]:443 ssl;

	# Server name must match the domain (maria-ol.42.fr).
	server_name maria-ol.42.fr;

	# ---- TLS: only v1.2 and v1.3 allowed (subject requirement) ---------------
	ssl_certificate     /etc/nginx/ssl/inception.crt;
	ssl_certificate_key /etc/nginx/ssl/inception.key;
	ssl_protocols TLSv1.2 TLSv1.3;

	# WordPress files live here (shared with the wordpress container via volume)
	root  /var/www/html;
	index index.php;

	# Serve static files directly; fall back to index.php for everything else
	location / {
		try_files $uri $uri/ /index.php?$args;
	}

	# ---- Hand .php requests to php-fpm in the wordpress container -------------
	# NGINX does not run PHP; it forwards via FastCGI to wordpress:9000.
	location ~ \.php$ {
		fastcgi_pass wordpress:9000;
		fastcgi_index index.php;
		include fastcgi_params;
		fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
	}
}
